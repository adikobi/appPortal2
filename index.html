<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sites</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23FF4D2E'/><rect x='24' y='24' width='22' height='22' fill='white'/><rect x='54' y='24' width='22' height='22' fill='white'/><rect x='24' y='54' width='22' height='22' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Heebo:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEFE8;--card:#E0E3D9;--ink:#11130E;--mute:#585D52;--acc:#FF4D2E;--ease:cubic-bezier(.23,1,.32,1);
--l0:#D7F25E;--l1:#A9D4FF;--l2:#FFB9A8;--l3:#A6E7C8;--l4:#FFE16B;--l5:#F4B8D6;--l6:#8EE2E0;--l7:#D9D6C9;
--c0:var(--l0);--c1:var(--l1);--c2:var(--l2);--c3:var(--l3);--c4:var(--l4);--c5:var(--l5);--c6:var(--l6);--c7:var(--l7)}
/* card palettes (light values; dark mode tints are derived) */
[data-palette=pastel]{--l0:#F6D6E0;--l1:#D6E4F6;--l2:#DDF0D2;--l3:#FBEBC8;--l4:#E3D6F3;--l5:#CFEFEA;--l6:#F9D9C7;--l7:#E6E6E0}
[data-palette=vivid]{--l0:#FFD400;--l1:#5C97FF;--l2:#FF6B6B;--l3:#2ED3A0;--l4:#FF9444;--l5:#C86BFF;--l6:#1FC7E6;--l7:#B6F23C}
[data-palette=earth]{--l0:#D9B99B;--l1:#C8C79A;--l2:#E0A98E;--l3:#A8BFA0;--l4:#E3CF9F;--l5:#BFA58F;--l6:#9FB5B0;--l7:#D8CDBB}
[data-palette=ocean]{--l0:#BFE3F5;--l1:#8EC8E8;--l2:#A6E1DC;--l3:#6FC2C9;--l4:#C9E9F2;--l5:#9DB8E3;--l6:#7FD1D9;--l7:#D3E6EE}
[data-palette=sunset]{--l0:#FFC9A3;--l1:#FFA69E;--l2:#FFD8A8;--l3:#F7A8C4;--l4:#FFB26B;--l5:#E8A0BF;--l6:#FFE0A3;--l7:#F4B6A0}
[data-palette=mono]{--l0:#E4E4E0;--l1:#D2D2CD;--l2:#C0C0BA;--l3:#DADAD5;--l4:#CBCBC5;--l5:#E9E9E5;--l6:#B9B9B3;--l7:#D6D6D0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E100C;--card:#1A1D17;--ink:#F0F1EA;--mute:#A0A599;
--c0:color-mix(in srgb,var(--l0) 22%,#0E100C);--c1:color-mix(in srgb,var(--l1) 22%,#0E100C);--c2:color-mix(in srgb,var(--l2) 22%,#0E100C);--c3:color-mix(in srgb,var(--l3) 22%,#0E100C);--c4:color-mix(in srgb,var(--l4) 22%,#0E100C);--c5:color-mix(in srgb,var(--l5) 22%,#0E100C);--c6:color-mix(in srgb,var(--l6) 22%,#0E100C);--c7:color-mix(in srgb,var(--l7) 22%,#0E100C)}}
:root[data-theme=dark]{--bg:#0E100C;--card:#1A1D17;--ink:#F0F1EA;--mute:#A0A599;
--c0:color-mix(in srgb,var(--l0) 22%,#0E100C);--c1:color-mix(in srgb,var(--l1) 22%,#0E100C);--c2:color-mix(in srgb,var(--l2) 22%,#0E100C);--c3:color-mix(in srgb,var(--l3) 22%,#0E100C);--c4:color-mix(in srgb,var(--l4) 22%,#0E100C);--c5:color-mix(in srgb,var(--l5) 22%,#0E100C);--c6:color-mix(in srgb,var(--l6) 22%,#0E100C);--c7:color-mix(in srgb,var(--l7) 22%,#0E100C)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:5rem}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 "Bricolage Grotesque",Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;pointer-events:none}
.wrap{max-width:1280px;margin:auto;padding:0 clamp(1rem,3vw,2rem)}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + .7rem) 0 .7rem}
.bar{display:flex;align-items:center;gap:.4rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:50%}
.search{flex:1;max-width:440px;margin:0 auto 0 1.4rem;position:relative}
.search input{width:100%;border:0;border-radius:99px;background:var(--card);padding:.6rem 1rem .6rem 2.6rem;outline-offset:2px}
.search svg{position:absolute;left:1rem;top:50%;translate:0 -50%;color:var(--mute);width:16px;height:16px}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;transition:background-color .15s,transform .12s var(--ease)}
.ib:active{transform:scale(.9)}
@media (hover:hover){.ib:hover{background:var(--card)}}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2rem;padding:clamp(2.5rem,7vw,5.5rem) 0 clamp(1.75rem,3vw,2.75rem)}
h1,.num{font-size:clamp(2.8rem,8.5vw,7rem);line-height:.92;letter-spacing:-.05em;font-weight:700;overflow-wrap:anywhere}
.sub{margin-top:1.4rem;max-width:44ch;font-size:1.1rem}
.num{text-align:right;font-variant-numeric:tabular-nums}
.num small{display:block;font-size:1rem;letter-spacing:0;font-weight:500;color:var(--mute);margin-top:.6rem;line-height:1}
.tools{display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.tabs{display:flex;flex-wrap:wrap;gap:.2rem}
.tabs button{border:0;background:none;color:var(--mute);padding:.4rem .95rem;border-radius:99px;cursor:pointer;font-size:.92rem;transition:background-color .15s,color .15s,transform .12s var(--ease)}
.tabs button:active{transform:scale(.95)}
@media (hover:hover){.tabs button:hover{color:var(--ink)}}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.tabs.sm{margin-bottom:1.5rem}.tabs.sm button{background:var(--card);color:var(--ink);font-size:.85rem;padding:.3rem .8rem}
.tabs.sm button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:8px}
.t0{--tc:var(--c0)}.t1{--tc:var(--c1)}.t2{--tc:var(--c2)}.t3{--tc:var(--c3)}.t4{--tc:var(--c4)}.t5{--tc:var(--c5)}.t6{--tc:var(--c6)}.t7{--tc:var(--c7)}
.card{position:relative;display:flex;flex-direction:column;min-height:220px;padding:1rem 1.3rem 1.3rem;background:var(--tc);transition:transform .28s var(--ease),opacity .2s}
.anim .card{animation:in .45s var(--ease) backwards;animation-delay:calc(var(--i)*35ms)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media (hover:hover){.card:hover{transform:translateY(-4px)}.card:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.14em}}
.card:active{transform:scale(.985)}
.card.hid{opacity:.45}
.cover{position:absolute;inset:0;z-index:1}
.card h3{margin-top:1.5rem;font-size:clamp(1.7rem,2.5vw,2.2rem);line-height:1;letter-spacing:-.04em;font-weight:700;overflow-wrap:anywhere}
.card p{margin-top:auto;padding-top:1.4rem;font-size:.95rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p:empty{display:none}
.acts{position:absolute;top:.55rem;right:.55rem;z-index:2;display:flex}
.act{width:34px;height:34px;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s,background-color .15s,transform .12s var(--ease)}
.card:hover .act,.card:focus-within .act,.act.on{opacity:1}
@media (hover:none){.act{opacity:.75}}
@media (hover:hover){.act:hover{background:rgba(0,0,0,.12)}}
.act{color:inherit;text-decoration:none}.act:active{transform:scale(.88)}
.act.on svg{fill:currentColor}
.list{grid-template-columns:1fr;gap:0}
.list .card{flex-direction:row;align-items:center;gap:1.25rem;min-height:0;padding:.95rem .75rem;background:none}
.list .card::before{content:"";width:16px;height:16px;background:var(--tc);flex:none}
@media (hover:hover){.list .card:hover{background:var(--card);transform:none}}
.list .card h3{margin:0;font-size:1.5rem;flex:0 1 38%}
.list .card p{margin:0;padding:0;flex:1;-webkit-line-clamp:1;color:var(--mute)}
.list .acts{position:static}
.skel{min-height:220px;background:var(--card);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.45}}
.state{grid-column:1/-1;padding:4rem 0;font-size:1.3rem;letter-spacing:-.02em}
.state .btn{margin-top:1rem;display:block}
footer{padding:4rem 0 2rem;overflow:hidden}
.big{font-size:clamp(3.5rem,16vw,14rem);line-height:.85;letter-spacing:-.06em;font-weight:700;color:var(--card);white-space:nowrap;user-select:none}
.foot{margin-top:1.5rem;color:var(--mute);font-size:.88rem}.foot a{color:inherit}
.btn{border:0;border-radius:99px;padding:.6rem 1.2rem;background:var(--card);cursor:pointer;font-weight:500;text-decoration:none;display:inline-block;transition:transform .12s var(--ease),filter .15s}
[hidden]{display:none!important}.btn:active{transform:scale(.96)}.btn.pri{background:var(--acc);color:#fff}
@media (hover:hover){.btn:hover{filter:brightness(.95)}}
.ov{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.5)}
.ov.open{display:flex;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{margin:auto;background:var(--bg);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.ql{width:min(1100px,96vw);height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden}
.ql .hd{display:flex;align-items:center;gap:.4rem;padding:.8rem 1rem .8rem 1.4rem}
.ql .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:1.2rem;letter-spacing:-.02em}
.ql iframe{flex:1;border:0;background:#fff;width:100%}
.set{width:min(500px,94vw);max-height:88vh;overflow:auto;padding:1.6rem}
.set h2{font-size:1.8rem;letter-spacing:-.04em}
.set h3{font-size:1rem;font-weight:700;margin:1.6rem 0 .2rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0}
.row input[type=text],.row input[type=password],.row input[type=url]{border:0;border-radius:10px;background:var(--card);padding:.55rem .8rem;min-width:0;width:55%}
.sw{display:flex;gap:.5rem}
.sw button{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;transition:transform .12s var(--ease)}
.sw button:active{transform:scale(.88)}.sw button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;padding:.4rem 0}
.pal button{border:0;border-radius:14px;background:var(--card);padding:.6rem;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:.5rem;font-size:.88rem;font-weight:500;transition:transform .12s var(--ease)}
.pal button:active{transform:scale(.97)}
.pal button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px;font-weight:700}
.pal .chips{display:grid;grid-template-columns:repeat(8,1fr);height:22px;border-radius:6px;overflow:hidden}
.tg{appearance:none;width:42px;height:26px;border-radius:13px;background:var(--card);position:relative;cursor:pointer;transition:background-color .2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s var(--ease)}
.tg:checked{background:var(--acc)}.tg:checked::after{transform:translateX(16px);background:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);translate:-50% 0;z-index:60;background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:99px;display:flex;gap:1rem;align-items:center;animation:pop .25s var(--ease)}
.toast button{background:none;border:0;font-weight:700;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:640px){
.grid:not(.list){grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid:not(.list) .card{min-height:172px;padding:.8rem .9rem .9rem}
.grid:not(.list) .card h3{margin-top:2.3rem;font-size:clamp(1.25rem,5.8vw,1.6rem)}
.grid:not(.list) .card p{font-size:.82rem;padding-top:.8rem;-webkit-line-clamp:3}
.grid:not(.list) .acts{top:.3rem;right:.25rem}
.grid:not(.list) .act{width:30px;height:30px}
.skel{min-height:172px}
.pal{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){.hero{grid-template-columns:1fr}.num{display:none}.brand span{display:none}.search{margin-left:.6rem}.list .card p{display:none}.list .card h3{flex:1}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <span class="brand"><img id="av" alt="" hidden><span id="bn">Sites</span></span>
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search sites" autocomplete="off" aria-label="Search sites"></label>
  <button class="ib" id="bRand" title="Surprise me" aria-label="Random site"><svg class="i" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
  <button class="ib" id="bTheme" title="Theme" aria-label="Theme"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  <button class="ib" id="bRef" title="Refresh" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
  <button class="ib" id="bSet" title="Settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</div></header>
<main class="wrap">
  <section class="hero"><div><h1 id="hn">My sites.</h1><p class="sub" id="hb">Everything I’ve built and put online.</p></div><div class="num"><span id="num">0</span><small>sites</small></div></section>
  <div class="tools">
    <div class="tabs" id="sort" role="group" aria-label="Sort"><button data-v="updated">Recent</button><button data-v="created">Newest</button><button data-v="name">A–Z</button><button data-v="visits">Most visited</button></div>
    <div class="tabs" id="scope" role="group" aria-label="Show"><button data-v="all">All</button><button data-v="pins">Pinned</button><button data-v="hidden">Hidden</button></div>
    <div class="tabs" id="view" role="group" aria-label="View"><button data-v="grid">Tiles</button><button data-v="list">List</button></div>
  </div>
  <div class="tabs sm" id="chips"></div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<footer class="wrap"><div class="big" id="big" aria-hidden="true">Sites</div><div class="foot" id="foot"></div></footer>

<div class="ov" id="ovQl"><div class="sheet ql" role="dialog" aria-label="Preview">
  <div class="hd"><span class="t" id="qlT"></span><button class="ib" id="qlP" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><button class="ib" id="qlN" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button><a class="btn" id="qlR" target="_blank" rel="noopener">Repo</a><a class="btn pri" id="qlO" target="_blank" rel="noopener">Open site</a><button class="ib" id="qlX" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <iframe id="qlF" title="Preview" referrerpolicy="no-referrer" loading="lazy"></iframe>
</div></div>
<div class="ov" id="ovSet"><div class="sheet set" role="dialog" aria-label="Settings">
  <h2>Settings</h2>
  <h3>Source</h3>
  <div class="row"><label for="sUser">GitHub username</label><input id="sUser" type="text" autocapitalize="off" spellcheck="false"></div>
  <div class="row"><label for="sTok">API token</label><input id="sTok" type="password" placeholder="Optional" autocomplete="off"></div>
  <div class="row"><label for="sFork">Include forks</label><input id="sFork" class="tg" type="checkbox"></div>
  <div class="row"><label for="sArch">Include archived</label><input id="sArch" class="tg" type="checkbox"></div>
  <h3>Card colors</h3>
  <div class="pal" id="pal"></div>
  <h3>Accent</h3>
  <div class="row"><div class="sw" id="sw"></div></div>
  <h3>Extra links</h3>
  <div id="cl"></div>
  <div class="row"><input id="cN" type="text" placeholder="Name" style="width:30%"><input id="cU" type="url" placeholder="https://…" style="width:50%"><button class="btn" id="cA">Add</button></div>
  <div class="row" style="margin-top:1.2rem"><button class="btn" id="dRst">Reset everything</button><button class="btn pri" id="sDone">Done</button></div>
</div></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ls=k=>{try{return localStorage.getItem(k)}catch{return null}},lw=(k,v)=>{try{localStorage.setItem(k,v)}catch{}},ld=k=>{try{localStorage.removeItem(k)}catch{}};
const D={user:"adikobi",token:"",view:"grid",sort:"updated",scope:"all",forks:false,archived:false,accent:"#FF4D2E",palette:"default",pins:[],hidden:[],visits:{},custom:[]};
let S={...D};try{S={...D,...JSON.parse(ls("portal:s")||"{}")}}catch{}
const save=()=>lw("portal:s",JSON.stringify(S));
const T={repos:[],q:"",topic:null,list:[],first:true,demo:false,profile:null,stamp:0};
const ck=()=>"portal:r:"+S.user.toLowerCase(),TTL=6e5;
const IC={star:'<svg class="i" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',link:'<svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>',x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',code:'<svg class="i" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>',undo:'<svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>'};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pretty=n=>n.replace(/[-_]+/g," ").replace(/\b[a-z]/g,c=>c.toUpperCase());
const hash=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return h%8};
const isRoot=n=>n.toLowerCase()===`${S.user}.github.io`.toLowerCase();
const siteUrl=r=>{const h=(r.homepage||"").trim();return/^https?:\/\//i.test(h)&&/github\.io/i.test(h)?h:`https://${S.user}.github.io/${r.name}/`};
const now=Date.now(),ago=d=>new Date(now-d*864e5).toISOString();
const DEMO=[["tel-aviv-bites","Where to eat in Tel Aviv, mapped and ranked.",3,["food","maps"]],["מחשבון-משכנתא","מחשבון פשוט שמראה כמה תשלמו בכל חודש.",9,["tools"]],["pocket-budget","A tiny budget tracker that lives in your browser.",14,["tools","finance"]],["sunday-recipes","Slow recipes for lazy weekends.",30,["food"]],["הגדרות-צבע","בוחר צבעים לפרויקטים ולעיצובים.",44,["design","tools"]],["trail-notes","Hikes I’ve done and the ones I want to.",60,["maps"]],["type-specimen","A playground for typefaces.",85,["design"]],["daily-words","One new word, every single day.",120,[]]].map(([n,d,a,t],i)=>({id:n,name:n,desc:d,url:"#",topics:t,updated:ago(a),created:ago(a+200+i*20)}));
async function gh(p){const h={Accept:"application/vnd.github+json"};if(S.token)h.Authorization="Bearer "+S.token;const r=await fetch("https://api.github.com"+p,{headers:h});if(!r.ok)throw new Error(r.status===404?`User “${S.user}” not found.`:"GitHub is not answering right now.");return r.json()}
async function fetchAll(){let a=[],p=1;for(;;){const j=await gh(`/users/${encodeURIComponent(S.user)}/repos?per_page=100&sort=updated&page=${p}`);a=a.concat(j);if(j.length<100)break;p++}return a}
const norm=l=>l.filter(r=>r.has_pages&&!isRoot(r.name)&&(S.archived||!r.archived)&&(S.forks||!r.fork)&&!r.disabled).map(r=>({id:r.name,name:r.name,desc:r.description,url:siteUrl(r),topics:r.topics||[],updated:r.pushed_at||r.updated_at,created:r.created_at,repo:r.html_url}));
async function profile(){try{const c=JSON.parse(ls("portal:p:"+S.user)||"null");let p=c&&Date.now()-c.t<36e5?c.d:null;if(!p){p=await gh("/users/"+encodeURIComponent(S.user));lw("portal:p:"+S.user,JSON.stringify({t:Date.now(),d:p}))}
const n=p.name||p.login;$("#bn").textContent=n;$("#hn").textContent=n+"’s sites.";$("#big").textContent=n;document.title=n+" — Sites";if(p.bio)$("#hb").textContent=p.bio;$("#av").src=p.avatar_url+"&s=96";$("#av").hidden=false}catch{}}
async function load(force){skeleton();T.demo=false;
try{const c=JSON.parse(ls(ck())||"null");if(!force&&c&&Date.now()-c.t<TTL){T.repos=c.d;T.stamp=c.t}else{const d=norm(await fetchAll());lw(ck(),JSON.stringify({t:Date.now(),d}));T.repos=d;T.stamp=Date.now()}}
catch(e){const c=JSON.parse(ls(ck())||"null");if(c){T.repos=c.d;T.stamp=c.t}else{T.repos=DEMO;T.demo=true}}
T.first=true;render();profile()}
const items=()=>[...T.repos,...S.custom.map(c=>({id:"c:"+c.url,name:c.name,desc:"",url:c.url,topics:[],updated:c.added,created:c.added}))];
function view(){const q=T.q.trim().toLowerCase(),pins=new Set(S.pins),hid=new Set(S.hidden);
let r=items().filter(x=>{const h=hid.has(x.id);if(S.scope==="hidden"?!h:h)return false;if(S.scope==="pins"&&!pins.has(x.id))return false;if(T.topic&&!x.topics.includes(T.topic))return false;return!q||[x.name,x.desc,...x.topics].join(" ").toLowerCase().includes(q)});
const cmp={updated:(a,b)=>new Date(b.updated)-new Date(a.updated),created:(a,b)=>new Date(b.created)-new Date(a.created),name:(a,b)=>a.name.localeCompare(b.name),visits:(a,b)=>(S.visits[b.id]||0)-(S.visits[a.id]||0)||new Date(b.updated)-new Date(a.updated)}[S.sort];
return r.sort((a,b)=>(pins.has(b.id)-pins.has(a.id))||cmp(a,b))}
function skeleton(){$("#grid").className="grid";$("#grid").innerHTML=Array(6).fill('<div class="skel"></div>').join("")}
function sync(){for(const[id,k]of[["#sort","sort"],["#view","view"],["#scope","scope"]])$$(id+" button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S[k]));document.documentElement.style.setProperty("--acc",S.accent);document.documentElement.dataset.palette=S.palette}
function render(){sync();
const tc={};T.repos.forEach(x=>x.topics.forEach(t=>tc[t]=(tc[t]||0)+1));const tp=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,8);
$("#chips").innerHTML=tp.map(t=>`<button data-t="${esc(t)}" aria-pressed="${T.topic===t}">${esc(t)}</button>`).join("");
const g=$("#grid"),l=view();T.list=l;g.className="grid "+S.view+(T.first?" anim":"");
$("#num").textContent=T.repos.length+S.custom.length;
$("#foot").innerHTML=(T.demo?"Showing sample sites. Open this page from your github.io address to see yours. · ":"")+`<a href="https://github.com/${esc(S.user)}" rel="noopener">GitHub</a>`;
const pins=new Set(S.pins),hid=new Set(S.hidden);
g.innerHTML=l.length?l.map((x,i)=>{const p=pins.has(x.id),h=hid.has(x.id);
return`<article class="card t${hash(x.name)}${h?" hid":""}" data-id="${esc(x.id)}" style="--i:${Math.min(i,16)}">
<a class="cover" href="${esc(x.url)}" target="_blank" rel="noopener" aria-label="Open ${esc(x.name)}"></a>
<div class="acts"><button class="act${p?" on":""}" data-a="pin" title="Pin" aria-label="Pin">${IC.star}</button><button class="act" data-a="ql" title="Preview" aria-label="Preview">${IC.eye}</button>${repoUrl(x)?`<a class="act" href="${esc(repoUrl(x))}" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub">${IC.code}</a>`:""}<button class="act" data-a="copy" title="Copy link" aria-label="Copy link">${IC.link}</button><button class="act" data-a="hide" title="${h?"Unhide":"Hide"}" aria-label="Hide">${h?IC.undo:IC.x}</button></div>
<h3 dir="auto">${esc(pretty(x.name))}</h3><p dir="auto">${esc(x.desc||"")}</p></article>`}).join(""):`<div class="state">${S.scope==="pins"?"Nothing pinned yet.":S.scope==="hidden"?"Nothing hidden.":"No sites match."}</div>`;
T.first=false}
function toast(msg,label,fn){$(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.innerHTML=`<span>${esc(msg)}</span>`+(label?`<button>${esc(label)}</button>`:"");document.body.append(t);if(label)t.querySelector("button").onclick=()=>{fn();t.remove()};setTimeout(()=>t.remove(),label?5000:2000)}
const repoUrl=x=>x.repo||(T.demo||String(x.id).startsWith("c:")?"":`https://github.com/${S.user}/${x.name}`);
const byId=id=>items().find(x=>x.id===id);
function toggle(a,id){const i=S[a].indexOf(id);i<0?S[a].push(id):S[a].splice(i,1);save()}
function act(a,id){const x=byId(id);if(!x)return;
if(a==="pin"){toggle("pins",id);render()}
else if(a==="hide"){const was=S.hidden.includes(id);toggle("hidden",id);render();toast(was?"Restored":"Hidden “"+pretty(x.name)+"”","Undo",()=>{toggle("hidden",id);render()})}
else if(a==="copy"){(navigator.clipboard?.writeText(x.url)||Promise.reject()).then(()=>toast("Link copied"),()=>toast(x.url))}
else if(a==="ql")openQl(id)}
const visit=e=>{const c=e.target.closest(".cover");if(c){const id=c.closest(".card").dataset.id;S.visits[id]=(S.visits[id]||0)+1;save()}};
$("#grid").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b){e.preventDefault();act(b.dataset.a,b.closest(".card").dataset.id);return}visit(e)});
$("#grid").addEventListener("auxclick",visit);
$("#chips").addEventListener("click",e=>{const c=e.target.closest("button");if(!c)return;T.topic=T.topic===c.dataset.t?null:c.dataset.t;render()});
for(const[id,k]of[["#sort","sort"],["#view","view"],["#scope","scope"]])$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S[k]=b.dataset.v;save();render()});
$("#q").addEventListener("input",e=>{T.q=e.target.value;render()});
$("#bRef").onclick=()=>load(true);$("#bSet").onclick=()=>openOv("#ovSet");
$("#bTheme").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark";lw("portal:theme",d.dataset.theme)};
$("#bRand").onclick=()=>{const l=T.list.length?T.list:view();if(!l.length)return;const x=l[Math.floor(Math.random()*l.length)];S.visits[x.id]=(S.visits[x.id]||0)+1;save();window.open(x.url,"_blank","noopener")};
function openOv(s){$(s).classList.add("open");if(s==="#ovSet")fillSet()}
function closeOv(s){$(s).classList.remove("open");if(s==="#ovQl")$("#qlF").src="about:blank"}
$$(".ov").forEach(o=>o.addEventListener("pointerdown",e=>{if(e.target===o)closeOv("#"+o.id)}));
let qi=-1;
function openQl(id){qi=T.list.findIndex(x=>x.id===id);if(qi<0)return;showQl();openOv("#ovQl")}
function showQl(){const x=T.list[qi];$("#qlT").textContent=pretty(x.name);$("#qlO").href=x.url;const rp=repoUrl(x);$("#qlR").hidden=!rp;if(rp)$("#qlR").href=rp;$("#qlF").src=x.url}
function stepQl(d){if(!T.list.length)return;qi=(qi+d+T.list.length)%T.list.length;showQl()}
$("#qlP").onclick=()=>stepQl(-1);$("#qlN").onclick=()=>stepQl(1);$("#qlX").onclick=()=>closeOv("#ovQl");
const PAL={default:["Lime & sky",["#D7F25E","#A9D4FF","#FFB9A8","#A6E7C8","#FFE16B","#F4B8D6","#8EE2E0","#D9D6C9"]],pastel:["Soft pastel",["#F6D6E0","#D6E4F6","#DDF0D2","#FBEBC8","#E3D6F3","#CFEFEA","#F9D9C7","#E6E6E0"]],vivid:["Vivid",["#FFD400","#5C97FF","#FF6B6B","#2ED3A0","#FF9444","#C86BFF","#1FC7E6","#B6F23C"]],earth:["Earth",["#D9B99B","#C8C79A","#E0A98E","#A8BFA0","#E3CF9F","#BFA58F","#9FB5B0","#D8CDBB"]],ocean:["Ocean",["#BFE3F5","#8EC8E8","#A6E1DC","#6FC2C9","#C9E9F2","#9DB8E3","#7FD1D9","#D3E6EE"]],sunset:["Sunset",["#FFC9A3","#FFA69E","#FFD8A8","#F7A8C4","#FFB26B","#E8A0BF","#FFE0A3","#F4B6A0"]],mono:["Mono",["#E4E4E0","#D2D2CD","#C0C0BA","#DADAD5","#CBCBC5","#E9E9E5","#B9B9B3","#D6D6D0"]]};
const ACC=["#FF4D2E","#0B6BFF","#00A86B","#E6007A","#11130E"];
function fillSet(){$("#sUser").value=S.user;$("#sTok").value=S.token;$("#sFork").checked=S.forks;$("#sArch").checked=S.archived;
$("#pal").innerHTML=Object.entries(PAL).map(([k,[n,c]])=>`<button data-p="${k}" aria-pressed="${S.palette===k}"><span class="chips">${c.map(x=>`<i style="background:${x}"></i>`).join("")}</span>${n}</button>`).join("");
$("#sw").innerHTML=ACC.map(c=>`<button style="background:${c}" data-c="${c}" aria-pressed="${S.accent===c}" aria-label="Accent ${c}"></button>`).join("");
$("#cl").innerHTML=S.custom.map((c,i)=>`<div class="row"><span dir="auto">${esc(c.name)}</span><button class="btn" data-d="${i}">Remove</button></div>`).join("")}
$("#pal").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;S.palette=b.dataset.p;save();sync();fillSet()});
$("#sw").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.accent=b.dataset.c;save();sync();fillSet()});
$("#cl").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;S.custom.splice(+b.dataset.d,1);save();fillSet();render()});
$("#cA").onclick=()=>{const n=$("#cN").value.trim(),u=$("#cU").value.trim();if(!n||!/^https?:\/\//i.test(u))return toast("Enter a name and an https:// link");S.custom.push({name:n,url:u,added:new Date().toISOString()});save();$("#cN").value=$("#cU").value="";fillSet();render()};
for(const[id,k]of[["#sFork","forks"],["#sArch","archived"]])$(id).onchange=e=>{S[k]=e.target.checked;save();ld(ck());load(true)};
$("#sTok").onchange=e=>{S.token=e.target.value.trim();save();load(true)};
$("#sUser").onchange=e=>{const v=e.target.value.trim();if(!/^[a-z\d](?:[a-z\d-]{0,38})$/i.test(v))return toast("That username isn’t valid");S.user=v;save();load(true);profile()};
$("#sDone").onclick=()=>closeOv("#ovSet");
$("#dRst").onclick=()=>{if(!confirm("Reset settings, pins and extra links?"))return;Object.keys(localStorage).filter(k=>k.startsWith("portal:")).forEach(ld);S={...D};sync();fillSet();load(true)};
document.addEventListener("keydown",e=>{
if(e.key==="Escape"){const o=$$(".ov.open").pop();if(o){closeOv("#"+o.id);return}if(document.activeElement===$("#q")){$("#q").value="";T.q="";render();$("#q").blur()}return}
if($("#ovQl").classList.contains("open")){if(e.key==="ArrowLeft")stepQl(-1);else if(e.key==="ArrowRight")stepQl(1);return}
if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||e.metaKey||e.ctrlKey||e.altKey||$$(".ov.open").length)return;
if(e.key==="/"){e.preventDefault();$("#q").focus()}else if(e.key==="g"){S.view=S.view==="grid"?"list":"grid";save();render()}});
const th=ls("portal:theme");if(th)document.documentElement.dataset.theme=th;
sync();load();
})();
</script>
</body>
</html>
