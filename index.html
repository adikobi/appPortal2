<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--mute:#6e6e73;--card:rgba(255,255,255,.72);--line:rgba(0,0,0,.09);--accent:#0071e3;--glass:rgba(245,245,247,.72);--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--ease:cubic-bezier(.2,.9,.3,1.05);--ok:#30d158;--bad:#ff453a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#f5f5f7;--mute:#98989d;--card:rgba(28,28,30,.72);--line:rgba(255,255,255,.11);--glass:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#000;--fg:#f5f5f7;--mute:#98989d;--card:rgba(28,28,30,.72);--line:rgba(255,255,255,.11);--glass:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:60vh;z-index:-1;pointer-events:none;background:radial-gradient(40% 60% at 30% 30%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(35% 50% at 75% 20%,color-mix(in srgb,#bf5af2 18%,transparent),transparent 70%);filter:blur(30px)}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + .7rem) 1.25rem .7rem;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:auto;display:flex;gap:.5rem;align-items:center}
.brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:.5rem}
.brand img{width:26px;height:26px;border-radius:50%}
.search{flex:1;position:relative}
.search input{width:100%;font:inherit;font-size:.95rem;padding:.5rem 2.8rem .5rem 2.2rem;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);outline:none;transition:box-shadow .2s,border-color .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.search svg{position:absolute;left:.7rem;top:50%;translate:0 -50%;width:16px;color:var(--mute)}
kbd{font:500 .7rem ui-monospace,monospace;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 .35rem;background:var(--card)}
.search kbd{position:absolute;right:.6rem;top:50%;translate:0 -50%}
.btn{border:1px solid var(--line);background:var(--card);padding:.45rem .7rem;border-radius:10px;cursor:pointer;font-size:.85rem;transition:transform .1s ease-out,background .2s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.act:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
main{max-width:1120px;margin:auto;padding:2.25rem 1.25rem 3rem}
.hero{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap}
.hero img{width:84px;height:84px;border-radius:50%;box-shadow:var(--shadow)}
h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.05;letter-spacing:-.035em;font-weight:700}
.sub{color:var(--mute);margin-top:.35rem;font-size:1.05rem;max-width:60ch}
.stats{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.7rem 1.1rem;min-width:110px}
.stat b{display:block;font-size:1.5rem;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:.75rem;color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.75rem 0 .75rem;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{font-size:.8rem;border:0;background:none;color:var(--mute);padding:.3rem .7rem;border-radius:8px;cursor:pointer;transition:background .25s var(--ease),color .2s,transform .1s}
.seg button:active{transform:scale(.95)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{font-size:.76rem;border:1px solid var(--line);background:none;color:var(--mute);padding:.15rem .6rem;border-radius:99px;cursor:pointer;transition:transform .1s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:transparent}
.count{margin-left:auto;color:var(--mute);font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1rem}
.grid.list{grid-template-columns:1fr;gap:.5rem}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:.6rem}
.card{position:relative;display:flex;flex-direction:column;gap:.45rem;padding:1.2rem;border-radius:20px;background:var(--card);border:1px solid var(--line);border-top-color:rgba(255,255,255,.35);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);transition:transform .45s var(--ease),box-shadow .3s,opacity .2s;will-change:transform}
.anim .card{animation:in .6s var(--ease) backwards;animation-delay:calc(var(--i)*30ms)}
@media (hover:hover){.card:hover{transform:translateY(-3px)}.grid.list .card:hover{transform:translateX(3px)}}
.card:active{transform:scale(.975);transition-duration:.1s}
.card.hid{opacity:.45}
.cover{position:absolute;inset:0;border-radius:inherit;z-index:1}
.cover:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}}
.top{display:flex;align-items:center;gap:.7rem}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:1.1rem;flex:none;position:relative}
.sdot{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--mute)}
.sdot.on{background:var(--ok)}.sdot.off{background:var(--bad)}
.name{font-weight:600;font-size:1.03rem;letter-spacing:-.015em;line-height:1.2;overflow-wrap:anywhere;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.badge{font-size:.62rem;font-weight:600;padding:.05rem .4rem;border-radius:99px;background:var(--accent);color:#fff;letter-spacing:.02em;text-transform:uppercase}
.badge.alt{background:var(--mute)}
.url{font-size:.74rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{color:var(--mute);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc:empty{display:none}
.meta{margin-top:auto;padding-top:.4rem;display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;font-size:.76rem;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:.3rem}
.acts{position:absolute;top:.6rem;right:.6rem;z-index:2;display:flex;gap:.1rem}
.act{border:0;background:none;cursor:pointer;font-size:.95rem;padding:.25rem .3rem;border-radius:8px;opacity:0;transition:opacity .2s,transform .1s,background .2s;color:var(--mute)}
.card:hover .act,.card:focus-within .act,.act.on{opacity:.9}
@media (hover:none){.act{opacity:.7}}
.act:hover{background:var(--line)}.act:active{transform:scale(.8)}
.act.on{color:#ff9f0a}
.grid.list .card{flex-direction:row;align-items:center;padding:.8rem 1.1rem;border-radius:16px}
.grid.list .top{flex:1;min-width:0}.grid.list .desc{display:none}.grid.list .meta{margin:0;padding:0;margin-right:4rem}
.grid.compact .card{padding:.8rem;border-radius:16px}.grid.compact .desc,.grid.compact .meta{display:none}.grid.compact .ico{width:32px;height:32px;font-size:.95rem;border-radius:8px}
.skel{height:170px;border-radius:20px;background:linear-gradient(100deg,var(--card) 30%,var(--line) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.state{text-align:center;padding:3.5rem 1rem;color:var(--mute);grid-column:1/-1}
.state p{max-width:52ch;margin:auto}.state .btn{margin:1rem .25rem 0}
footer{text-align:center;color:var(--mute);font-size:.76rem;padding:0 1rem 2rem}
footer a{color:inherit}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.open{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.pal{width:min(560px,94vw);align-self:flex-start;margin-top:12vh;overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:1.05rem;padding:1rem 1.1rem;outline:none}
.pal ul{list-style:none;padding:.4rem;max-height:50vh;overflow:auto}
.pal li{padding:.55rem .75rem;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:1rem;font-size:.92rem}
.pal li small{color:var(--mute)}
.pal li[aria-selected=true]{background:var(--accent);color:#fff}.pal li[aria-selected=true] small{color:rgba(255,255,255,.8)}
.ql{width:min(1100px,96vw);height:min(86vh,900px);display:flex;flex-direction:column;overflow:hidden;transition:transform .45s var(--ease)}
.ql .hd{display:flex;align-items:center;gap:.6rem;padding:.35rem .9rem .6rem;flex-wrap:wrap}
.grab{touch-action:none;cursor:grab;padding:.5rem 0 .2rem;flex:none}
.grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:auto;filter:brightness(.8)}
.ql .t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ql iframe{flex:1;border:0;background:#fff;width:100%}
.set{width:min(520px,94vw);max-height:88vh;overflow:auto;padding:1.4rem}
.set h2{font-size:1.4rem;letter-spacing:-.02em;margin-bottom:1rem}
.set h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:1.3rem 0 .5rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.row input[type=text],.row input[type=password],.row input[type=url]{font:inherit;font-size:.88rem;padding:.35rem .6rem;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0;width:55%}
.sw{display:flex;gap:.4rem}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .1s}
.sw button:active{transform:scale(.85)}.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--fg)}
.tg{appearance:none;width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:background .25s;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
.tg:checked{background:var(--ok)}.tg:checked::after{transform:translateX(16px)}
.cl{display:grid;gap:.4rem}
.cl .row{border:0;padding:.2rem 0}
.btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.help{display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;font-size:.85rem;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);translate:-50% 0;z-index:60;background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:14px;font-size:.88rem;display:flex;gap:.9rem;align-items:center;box-shadow:var(--shadow);animation:pop .4s var(--ease)}
.toast button{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}.card:hover,.card:active{transform:none}}
@media (prefers-reduced-transparency:reduce){header,.card,.ov{backdrop-filter:none;-webkit-backdrop-filter:none}.card{background:var(--bg)}}
@media (prefers-contrast:more){.card,.btn,.search input,.stat{border-color:var(--fg)}}
@media (max-width:640px){.brand span,.search kbd,.hide-m{display:none}.hero img{width:64px;height:64px}}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand"><img id="av" alt="" hidden><span id="bn">Portal</span></span>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Search sites, topics, languages" autocomplete="off" aria-label="Search"><kbd>/</kbd></label>
  <button class="btn hide-m" id="bPal" title="Command palette (⌘K)">⌘K</button>
  <button class="btn" id="bRand" title="Random site">🎲</button>
  <button class="btn" id="bTheme" title="Theme" aria-label="Theme">◐</button>
  <button class="btn" id="bRef" title="Refresh" aria-label="Refresh">↻</button>
  <button class="btn" id="bSet" title="Settings" aria-label="Settings">⚙︎</button>
</div></header>
<main id="mn">
  <div class="hero"><img id="hav" alt="" hidden><div><h1 id="hn">My sites.</h1><p class="sub" id="hb">Every live GitHub Pages site, updated automatically.</p></div></div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <div class="seg" id="sort" role="group" aria-label="Sort">
      <button data-v="updated">Recent</button><button data-v="created">New</button><button data-v="name">A–Z</button><button data-v="stars">Stars</button><button data-v="visits">Visited</button>
    </div>
    <div class="seg" id="view" role="group" aria-label="View"><button data-v="grid" title="Grid">▦</button><button data-v="list" title="List">☰</button><button data-v="compact" title="Compact">▪▪</button></div>
    <div class="seg" id="scope" role="group" aria-label="Scope"><button data-v="all">All</button><button data-v="pins">★ Pinned</button><button data-v="hidden">Hidden</button></div>
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<footer><span id="foot"></span></footer>

<div class="ov" id="ovPal"><div class="sheet pal" role="dialog" aria-label="Command palette"><input id="pq" placeholder="Jump to a site or run a command…" autocomplete="off"><ul id="pl"></ul></div></div>
<div class="ov" id="ovQl"><div class="sheet ql" id="qlS" role="dialog" aria-label="Quick look">
  <div class="grab" id="grab"><i></i></div>
  <div class="hd"><span class="t" id="qlT"></span><button class="btn" id="qlP">←</button><button class="btn" id="qlN">→</button><a class="btn pri" id="qlO" target="_blank" rel="noopener" style="text-decoration:none">Open ↗</a><button class="btn" id="qlX">✕</button></div>
  <iframe id="qlF" title="Preview" referrerpolicy="no-referrer" loading="lazy"></iframe>
</div></div>
<div class="ov" id="ovSet"><div class="sheet set" role="dialog" aria-label="Settings">
  <h2>Settings</h2>
  <h3>Source</h3>
  <div class="row"><label for="sUser">GitHub username</label><input id="sUser" type="text" autocapitalize="off" spellcheck="false"></div>
  <div class="row"><label for="sTok">API token (optional)</label><input id="sTok" type="password" placeholder="Raises rate limit" autocomplete="off"></div>
  <div class="row"><label for="sFork">Include forks</label><input id="sFork" class="tg" type="checkbox"></div>
  <div class="row"><label for="sArch">Include archived</label><input id="sArch" class="tg" type="checkbox"></div>
  <div class="row"><label for="sStat">Live reachability check</label><input id="sStat" class="tg" type="checkbox"></div>
  <h3>Appearance</h3>
  <div class="row"><span>Accent</span><div class="sw" id="sw"></div></div>
  <h3>Custom links</h3>
  <div class="cl" id="cl"></div>
  <div class="row"><input id="cN" type="text" placeholder="Name" style="width:30%"><input id="cU" type="url" placeholder="https://…" style="width:50%"><button class="btn" id="cA">Add</button></div>
  <h3>Data</h3>
  <div class="btns"><button class="btn" id="dExp">Export</button><button class="btn" id="dImp">Import</button><button class="btn" id="dCache">Clear cache</button><button class="btn" id="dRst" style="color:var(--bad)">Reset all</button></div>
  <h3>Shortcuts</h3>
  <div class="help"><kbd>/</kbd><span>Search</span><kbd>⌘K</kbd><span>Command palette</span><kbd>J / K</kbd><span>Next / previous site</span><kbd>Space</kbd><span>Quick look</span><kbd>P</kbd><span>Pin</span><kbd>H</kbd><span>Hide</span><kbd>G</kbd><span>Cycle view</span><kbd>Esc</kbd><span>Close</span></div>
  <div class="btns"><button class="btn pri" id="sDone">Done</button></div>
</div></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ls=k=>{try{return localStorage.getItem(k)}catch{return null}},lw=(k,v)=>{try{localStorage.setItem(k,v)}catch{}},ld=k=>{try{localStorage.removeItem(k)}catch{}};
const D={user:"adikobi",token:"",view:"grid",sort:"updated",scope:"all",forks:false,archived:false,status:true,accent:"#0071e3",pins:[],hidden:[],visits:{},custom:[]};
let S={...D};try{S={...D,...JSON.parse(ls("portal:s")||"{}")}}catch{}
const save=()=>lw("portal:s",JSON.stringify(S));
const T={repos:[],q:"",lang:null,topic:null,rl:null,stamp:0,err:null,status:{},first:true,list:[]};
const TTL=10*60*1000,ck=()=>"portal:r:"+S.user.toLowerCase();
const colors={JavaScript:"#f1e05a",TypeScript:"#3178c6",HTML:"#e34c26",CSS:"#563d7c",Python:"#3572A5",Java:"#b07219","C#":"#178600",Go:"#00ADD8",Rust:"#dea584",Vue:"#41b883",Svelte:"#ff3e00",Shell:"#89e051","C++":"#f34b7d",Dart:"#00B4AB",Kotlin:"#A97BFF",Swift:"#F05138"};
const grads=[["#0a84ff","#5e5ce6"],["#ff9f0a","#ff375f"],["#30d158","#0a84ff"],["#bf5af2","#ff375f"],["#64d2ff","#5e5ce6"],["#ffd60a","#ff9f0a"]];
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return grads[h%grads.length]};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rel=d=>{const s=(Date.now()-new Date(d))/1e3,u=[[31536e3,"y"],[2592e3,"mo"],[604800,"w"],[86400,"d"],[3600,"h"],[60,"m"]];for(const[n,l]of u)if(s>=n)return Math.floor(s/n)+l+" ago";return "just now"};
const pretty=n=>n.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const isRoot=n=>n.toLowerCase()===`${S.user}.github.io`.toLowerCase();
const siteUrl=r=>{const h=(r.homepage||"").trim();if(/^https?:\/\//i.test(h)&&/github\.io/i.test(h))return h;return `https://${S.user}.github.io/${r.name}/`};

/* data */
async function gh(path){
  const headers={Accept:"application/vnd.github+json"};if(S.token)headers.Authorization="Bearer "+S.token;
  const res=await fetch("https://api.github.com"+path,{headers});
  const rem=res.headers.get("x-ratelimit-remaining"),lim=res.headers.get("x-ratelimit-limit");if(rem!=null)T.rl=`${rem}/${lim}`;
  if(!res.ok){const e=new Error(res.status===404?`User "${S.user}" not found.`:(res.status===403||res.status===429)?"GitHub API rate limit reached. Add a token in Settings or try later.":res.status===401?"Invalid API token.":`GitHub API error (${res.status}).`);e.http=res.status;throw e}
  return res.json()}
async function fetchAll(){let all=[],p=1;while(true){const j=await gh(`/users/${encodeURIComponent(S.user)}/repos?per_page=100&sort=updated&page=${p}`);all=all.concat(j);if(j.length<100)break;p++}return all}
const norm=l=>l.filter(r=>r.has_pages&&!isRoot(r.name)&&(S.archived||!r.archived)&&(S.forks||!r.fork)&&!r.disabled).map(r=>({id:r.name,name:r.name,desc:r.description,url:siteUrl(r),repo:r.html_url,lang:r.language,stars:r.stargazers_count,updated:r.pushed_at||r.updated_at,created:r.created_at,topics:r.topics||[],fork:r.fork,archived:r.archived}));
async function profile(){
  try{const c=JSON.parse(ls("portal:p:"+S.user)||"null");let p=c&&Date.now()-c.t<36e5?c.d:null;
    if(!p){p=await gh("/users/"+encodeURIComponent(S.user));lw("portal:p:"+S.user,JSON.stringify({t:Date.now(),d:p}))}
    $("#bn").textContent=p.name||p.login;$("#hn").textContent=(p.name||p.login)+"’s sites.";document.title=(p.name||p.login)+" — Sites";
    if(p.bio)$("#hb").textContent=p.bio;
    for(const i of ["#av","#hav"]){$(i).src=p.avatar_url+"&s=160";$(i).hidden=false}
    T.profile=p;stats()}catch{}}
async function load(force){
  skeleton();T.err=null;
  try{
    const c=JSON.parse(ls(ck())||"null");
    if(!force&&c&&Date.now()-c.t<TTL){T.repos=c.d;T.stamp=c.t}
    else{const d=norm(await fetchAll());lw(ck(),JSON.stringify({t:Date.now(),d}));T.repos=d;T.stamp=Date.now()}
  }catch(e){
    const c=JSON.parse(ls(ck())||"null");
    if(c){T.repos=c.d;T.stamp=c.t;T.err="Offline or rate-limited — showing cached data."}
    else{T.repos=[];T.err=e instanceof TypeError?"Couldn’t reach api.github.com. Open this page from your deployed https://"+S.user+".github.io/ URL (not a local file or sandboxed preview), and disable ad-blockers for it.":e.message}
  }
  T.first=true;render();profile();checkStatus()}

/* derive */
function items(){
  const base=[...T.repos,...S.custom.map(c=>({id:"c:"+c.url,name:c.name,desc:c.desc||"",url:c.url,custom:true,topics:[],updated:c.added,created:c.added,stars:0}))];
  return base}
function view(){
  const q=T.q.trim().toLowerCase(),pins=new Set(S.pins),hid=new Set(S.hidden);
  let r=items().filter(x=>{
    const h=hid.has(x.id);
    if(S.scope==="hidden"?!h:h)return false;
    if(S.scope==="pins"&&!pins.has(x.id))return false;
    if(T.lang&&x.lang!==T.lang)return false;if(T.topic&&!x.topics.includes(T.topic))return false;
    return !q||[x.name,x.desc,x.lang,...x.topics].join(" ").toLowerCase().includes(q)});
  const cmp={updated:(a,b)=>new Date(b.updated)-new Date(a.updated),created:(a,b)=>new Date(b.created)-new Date(a.created),name:(a,b)=>a.name.localeCompare(b.name),stars:(a,b)=>b.stars-a.stars||new Date(b.updated)-new Date(a.updated),visits:(a,b)=>(S.visits[b.id]||0)-(S.visits[a.id]||0)||new Date(b.updated)-new Date(a.updated)}[S.sort];
  r.sort((a,b)=>(pins.has(b.id)-pins.has(a.id))||cmp(a,b));return r}

/* render */
function stats(){
  const r=T.repos,stars=r.reduce((n,x)=>n+x.stars,0),langs=new Set(r.map(x=>x.lang).filter(Boolean)).size,latest=r.length?rel(r.slice().sort((a,b)=>new Date(b.updated)-new Date(a.updated))[0].updated):"—";
  const s=[[r.length+S.custom.length,"Sites"],[stars,"Stars"],[langs,"Languages"],[latest,"Last update"]];
  if(T.profile)s.push([T.profile.public_repos,"Repos"],[T.profile.followers,"Followers"]);
  $("#stats").innerHTML=s.map(([a,b])=>`<div class="stat"><b>${esc(a)}</b><span>${b}</span></div>`).join("")}
function skeleton(){$("#grid").className="grid";$("#grid").innerHTML=Array(6).fill('<div class="skel"></div>').join("")}
function sync(){
  for(const[id,k]of[["#sort","sort"],["#view","view"],["#scope","scope"]])$$(id+" button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S[k]));
  document.documentElement.style.setProperty("--accent",S.accent)}
function chips(){
  const r=T.repos,lc={},tc={};r.forEach(x=>{if(x.lang)lc[x.lang]=(lc[x.lang]||0)+1;x.topics.forEach(t=>tc[t]=(tc[t]||0)+1)});
  const L=Object.keys(lc).sort((a,b)=>lc[b]-lc[a]),Tp=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,10);
  $("#chips").innerHTML=(L.length>1?L.map(l=>`<button class="chip" data-l="${esc(l)}" aria-pressed="${T.lang===l}">${esc(l)}</button>`).join(""):"")+Tp.map(t=>`<button class="chip" data-t="${esc(t)}" aria-pressed="${T.topic===t}">#${esc(t)}</button>`).join("")}
function render(){
  sync();stats();chips();
  const g=$("#grid"),l=view();T.list=l;g.className="grid "+S.view+(T.first?" anim":"");
  const pins=new Set(S.pins),hid=new Set(S.hidden);
  $("#count").textContent=`${l.length} site${l.length===1?"":"s"}`;
  $("#foot").innerHTML=`${T.stamp?"Updated "+rel(T.stamp):""}${T.rl?" · API "+T.rl:""} · <a href="https://github.com/${esc(S.user)}" rel="noopener">GitHub</a>`;
  let html=T.err?`<div class="state" style="padding:1.2rem"><p>${esc(T.err)}</p><button class="btn" data-a="retry">Retry</button></div>`:"";
  if(!l.length)html+=`<div class="state"><p>${T.repos.length||S.custom.length?(S.scope==="all"?"No matches.":"Nothing here yet."):"No GitHub Pages sites found."}</p>${T.err?"":'<button class="btn" data-a="settings">Settings</button>'}</div>`;
  g.innerHTML=html+l.map((x,i)=>{
    const[g1,g2]=hue(x.name),p=pins.has(x.id),h=hid.has(x.id),fresh=!x.custom&&Date.now()-new Date(x.updated)<14*864e5,st=T.status[x.url];
    return `<article class="card${h?" hid":""}" data-id="${esc(x.id)}" style="--i:${Math.min(i,20)}">
      <a class="cover" href="${esc(x.url)}" target="_blank" rel="noopener" aria-label="Open ${esc(x.name)}"></a>
      <div class="acts"><button class="act${p?" on":""}" data-a="pin" title="Pin (P)" aria-label="Pin">${p?"★":"☆"}</button><button class="act" data-a="ql" title="Quick look (Space)" aria-label="Quick look">👁</button><button class="act" data-a="copy" title="Copy link" aria-label="Copy link">🔗</button><button class="act" data-a="hide" title="${h?"Unhide":"Hide"} (H)" aria-label="Hide">${h?"↺":"✕"}</button></div>
      <div class="top"><div class="ico" style="background:linear-gradient(135deg,${g1},${g2})">${esc(x.name[0].toUpperCase())}<i class="sdot${st===true?" on":st===false?" off":""}" title="${st===true?"Reachable":st===false?"Unreachable":"Unchecked"}"></i></div>
      <div style="min-width:0;padding-right:5rem"><div class="name">${esc(S.view==="compact"||x.custom?x.name:pretty(x.name))}${fresh?'<span class="badge">New</span>':""}${x.custom?'<span class="badge alt">Link</span>':""}${x.fork?'<span class="badge alt">Fork</span>':""}</div><div class="url">${esc(x.url.replace(/^https?:\/\//,""))}</div></div></div>
      <p class="desc">${esc(x.desc||"")}</p>
      <div class="meta">${x.lang?`<span><i class="dot" style="background:${colors[x.lang]||"#8e8e93"}"></i>${esc(x.lang)}</span>`:""}${x.stars?`<span>★ ${x.stars}</span>`:""}${x.custom?"":`<span>${rel(x.updated)}</span>`}${S.visits[x.id]?`<span>${S.visits[x.id]}× opened</span>`:""}${x.repo?`<a href="${esc(x.repo)}" target="_blank" rel="noopener" style="position:relative;z-index:2;color:inherit">Repo ↗</a>`:""}</div>
    </article>`}).join("");
  T.first=false}

/* status */
async function checkStatus(){
  if(!S.status)return;const todo=items().filter(x=>!(x.url in T.status));let i=0;
  const run=async()=>{while(i<todo.length){const x=todo[i++],ac=new AbortController(),t=setTimeout(()=>ac.abort(),8000);
    try{await fetch(x.url,{mode:"no-cors",cache:"no-store",signal:ac.signal});T.status[x.url]=true}catch{T.status[x.url]=false}clearTimeout(t);
    $$(`.card[data-id="${CSS.escape(x.id)}"] .sdot`).forEach(d=>{d.className="sdot "+(T.status[x.url]?"on":"off");d.title=T.status[x.url]?"Reachable":"Unreachable"})}};
  await Promise.all([run(),run(),run(),run()])}

/* actions */
function toast(msg,label,fn){$(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.innerHTML=`<span>${esc(msg)}</span>`+(label?`<button>${esc(label)}</button>`:"");document.body.append(t);
  if(label)t.querySelector("button").onclick=()=>{fn();t.remove()};setTimeout(()=>t.remove(),label?5000:2000)}
const byId=id=>items().find(x=>x.id===id);
function toggle(arr,id){const i=S[arr].indexOf(id);i<0?S[arr].push(id):S[arr].splice(i,1);save()}
function act(a,id){
  const x=byId(id);if(!x&&!["retry","settings"].includes(a))return;
  if(a==="pin"){toggle("pins",id);render()}
  else if(a==="hide"){const was=S.hidden.includes(id);toggle("hidden",id);render();toast(was?"Restored":"Hidden “"+x.name+"”","Undo",()=>{toggle("hidden",id);render()})}
  else if(a==="copy"){(navigator.clipboard?.writeText(x.url)||Promise.reject()).then(()=>toast("Link copied"),()=>toast(x.url))}
  else if(a==="ql")openQl(id);
  else if(a==="retry")load(true);else if(a==="settings")openOv("#ovSet")}
$("#grid").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");
  if(b){e.preventDefault();act(b.dataset.a,b.closest(".card")?.dataset.id);return}
  const c=e.target.closest(".cover");if(c){const id=c.closest(".card").dataset.id;S.visits[id]=(S.visits[id]||0)+1;save()}});
$("#grid").addEventListener("auxclick",e=>{const c=e.target.closest(".cover");if(c){const id=c.closest(".card").dataset.id;S.visits[id]=(S.visits[id]||0)+1;save()}});
$("#chips").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;if(c.dataset.l)T.lang=T.lang===c.dataset.l?null:c.dataset.l;else T.topic=T.topic===c.dataset.t?null:c.dataset.t;render()});
for(const[id,k]of[["#sort","sort"],["#view","view"],["#scope","scope"]])$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S[k]=b.dataset.v;save();render()});
$("#q").addEventListener("input",e=>{T.q=e.target.value;render()});
$("#bRef").onclick=()=>{T.status={};load(true)};
$("#bSet").onclick=()=>openOv("#ovSet");$("#bPal").onclick=openPal;
$("#bRand").onclick=random;
$("#bTheme").onclick=theme;
function theme(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark";lw("portal:theme",d.dataset.theme)}
function random(){const l=T.list.length?T.list:view();if(!l.length)return;const x=l[Math.floor(Math.random()*l.length)];S.visits[x.id]=(S.visits[x.id]||0)+1;save();window.open(x.url,"_blank","noopener")}
function cycleView(){const v=["grid","list","compact"];S.view=v[(v.indexOf(S.view)+1)%3];save();render()}

/* overlays */
function openOv(s){$(s).classList.add("open");$(s).dataset.prev=document.activeElement?.id||"";if(s==="#ovSet")fillSet()}
function closeOv(s){const o=$(s);o.classList.remove("open");if(s==="#ovQl")$("#qlF").src="about:blank"}
$$(".ov").forEach(o=>o.addEventListener("pointerdown",e=>{if(e.target===o)closeOv("#"+o.id)}));
/* palette */
let pi=0,pItems=[];
function cmds(){return[["Toggle theme","⌘",theme],["Refresh sites","↻",()=>$("#bRef").click()],["Random site","🎲",random],["Cycle layout","G",cycleView],["Open settings","⚙︎",()=>openOv("#ovSet")],["Show pinned","★",()=>{S.scope="pins";save();render()}],["Show all","",()=>{S.scope="all";save();render()}]].map(([n,k,f])=>({t:n,s:k,f,c:1}))}
function openPal(){openOv("#ovPal");$("#pq").value="";pi=0;palRender();setTimeout(()=>$("#pq").focus(),30)}
function palRender(){
  const q=$("#pq").value.trim().toLowerCase();
  const sites=items().filter(x=>!q||(x.name+" "+(x.desc||"")).toLowerCase().includes(q)).slice(0,8).map(x=>({t:pretty(x.name),s:x.url.replace(/^https?:\/\//,""),f:()=>{S.visits[x.id]=(S.visits[x.id]||0)+1;save();window.open(x.url,"_blank","noopener")}}));
  pItems=[...sites,...cmds().filter(c=>!q||c.t.toLowerCase().includes(q))];pi=Math.min(pi,Math.max(0,pItems.length-1));
  $("#pl").innerHTML=pItems.map((x,i)=>`<li role="option" data-i="${i}" aria-selected="${i===pi}"><span>${esc(x.t)}</span><small>${esc(x.s||"")}</small></li>`).join("")||'<li style="cursor:default">No results</li>'}
$("#pq").addEventListener("input",()=>{pi=0;palRender()});
$("#pq").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();pi=(pi+1)%pItems.length;palRender()}
  else if(e.key==="ArrowUp"){e.preventDefault();pi=(pi-1+pItems.length)%pItems.length;palRender()}
  else if(e.key==="Enter"&&pItems[pi]){closeOv("#ovPal");pItems[pi].f()}});
$("#pl").addEventListener("click",e=>{const li=e.target.closest("li[data-i]");if(li){closeOv("#ovPal");pItems[+li.dataset.i].f()}});
/* quick look */
let qi=-1;
function openQl(id){qi=T.list.findIndex(x=>x.id===id);if(qi<0)return;showQl();openOv("#ovQl")}
function showQl(){const x=T.list[qi];$("#qlT").textContent=pretty(x.name);$("#qlO").href=x.url;$("#qlF").src=x.url;$("#qlS").style.transform=""}
function stepQl(d){if(!T.list.length)return;qi=(qi+d+T.list.length)%T.list.length;showQl()}
$("#qlP").onclick=()=>stepQl(-1);$("#qlN").onclick=()=>stepQl(1);$("#qlX").onclick=()=>closeOv("#ovQl");
{const g=$("#grab"),sh=$("#qlS");let on=false,y0=0,dy=0,ly=0,lt=0,vy=0;
 g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);on=true;y0=ly=e.clientY;lt=e.timeStamp;dy=0;vy=0;sh.style.transition="none"};
 g.onpointermove=e=>{if(!on)return;const raw=e.clientY-y0;dy=raw>0?raw:raw*.2;vy=(e.clientY-ly)/((e.timeStamp-lt)||1);ly=e.clientY;lt=e.timeStamp;sh.style.transform=`translateY(${dy}px)`};
 g.onpointerup=g.onpointercancel=()=>{if(!on)return;on=false;sh.style.transition="";if(dy+vy*200>160)closeOv("#ovQl");else sh.style.transform=""}}
/* settings */
const ACC=["#0071e3","#bf5af2","#ff375f","#ff9f0a","#30d158","#64d2ff"];
function fillSet(){
  $("#sUser").value=S.user;$("#sTok").value=S.token;$("#sFork").checked=S.forks;$("#sArch").checked=S.archived;$("#sStat").checked=S.status;
  $("#sw").innerHTML=ACC.map(c=>`<button style="background:${c}" data-c="${c}" aria-pressed="${S.accent===c}" aria-label="Accent ${c}"></button>`).join("");
  $("#cl").innerHTML=S.custom.map((c,i)=>`<div class="row"><span>${esc(c.name)} <small style="color:var(--mute)">${esc(c.url.replace(/^https?:\/\//,""))}</small></span><button class="btn" data-d="${i}">Remove</button></div>`).join("")}
$("#sw").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.accent=b.dataset.c;save();sync();fillSet()});
$("#cl").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;S.custom.splice(+b.dataset.d,1);save();fillSet();render()});
$("#cA").onclick=()=>{const n=$("#cN").value.trim(),u=$("#cU").value.trim();if(!n||!/^https?:\/\//i.test(u))return toast("Enter a name and an https:// URL");S.custom.push({name:n,url:u,added:new Date().toISOString()});save();$("#cN").value=$("#cU").value="";fillSet();render();checkStatus()};
for(const[id,k]of[["#sFork","forks"],["#sArch","archived"],["#sStat","status"]])$(id).onchange=e=>{S[k]=e.target.checked;save();if(k!=="status"){ld(ck());}if(k==="status"&&S.status)checkStatus();else if(k!=="status")load(true)};
$("#sTok").onchange=e=>{S.token=e.target.value.trim();save();load(true)};
$("#sUser").onchange=e=>{const v=e.target.value.trim();if(!/^[a-z\d](?:[a-z\d-]{0,38})$/i.test(v))return toast("Invalid username");S.user=v;T.status={};save();load(true)};
$("#sDone").onclick=()=>closeOv("#ovSet");
$("#dExp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,token:""},null,2)],{type:"application/json"}));a.download="portal-settings.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("#dImp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());S={...D,...j,token:S.token};save();sync();fillSet();load(true);toast("Imported")}catch{toast("Invalid file")}e.target.value=""};
$("#dCache").onclick=()=>{Object.keys(localStorage).filter(k=>/^portal:[rp]:/.test(k)).forEach(ld);T.status={};load(true);toast("Cache cleared")};
$("#dRst").onclick=()=>{if(!confirm("Reset all settings, pins and custom links?"))return;Object.keys(localStorage).filter(k=>k.startsWith("portal:")).forEach(ld);S={...D};T.status={};sync();fillSet();load(true)};

/* keys */
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#ovPal").classList.contains("open")?closeOv("#ovPal"):openPal();return}
  if(e.key==="Escape"){const o=$$(".ov.open").pop();if(o){closeOv("#"+o.id);return}if(document.activeElement===$("#q")){$("#q").value="";T.q="";render();$("#q").blur()}return}
  if($("#ovQl").classList.contains("open")){if(e.key==="ArrowLeft")stepQl(-1);else if(e.key==="ArrowRight")stepQl(1);return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey||$$(".ov.open").length)return;
  const cards=$$(".card"),cur=document.activeElement.closest?.(".card")||null,i=cards.indexOf(cur);
  const focus=n=>{const c=cards[Math.max(0,Math.min(cards.length-1,n))];c?.querySelector(".cover")?.focus();c?.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})};
  if(e.key==="/"){e.preventDefault();$("#q").focus()}
  else if(e.key==="j"||e.key==="ArrowDown"&&cur){e.preventDefault();focus(i+1)}
  else if(e.key==="k"||e.key==="ArrowUp"&&cur){e.preventDefault();focus(i<0?0:i-1)}
  else if(cur&&e.key===" "){e.preventDefault();act("ql",cur.dataset.id)}
  else if(cur&&e.key==="p")act("pin",cur.dataset.id);
  else if(cur&&e.key==="h")act("hide",cur.dataset.id);
  else if(e.key==="g")cycleView()});

/* init */
const th=ls("portal:theme");if(th)document.documentElement.dataset.theme=th;
const qp=new URLSearchParams(location.search).get("q");if(qp){T.q=qp;$("#q").value=qp}
sync();load();
})();
</script>
</body>
